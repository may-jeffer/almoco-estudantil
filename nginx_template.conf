# ==============================================================================
# CONFIGURAÇÃO RECOMENDADA DO NGINX PARA O SISTEMA DE ALMOÇO ESTUDANTIL
# ==============================================================================
# 
# Instruções de instalação no Linux (Ubuntu/Debian):
# 1. Copie este arquivo para o Nginx:
#    sudo cp nginx_template.conf /etc/nginx/sites-available/almoco-estudantil.conf
# 2. Edite e altere 'cantina.escola.edu.br' pelo seu domínio/subdomínio real:
#    sudo nano /etc/nginx/sites-available/almoco-estudantil.conf
# 3. Ative o site e reinicie o Nginx:
#    sudo ln -s /etc/nginx/sites-available/almoco-estudantil.conf /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# 4. Gere o certificado SSL gratuito com o Certbot:
#    sudo certbot --nginx -d cantina.escola.edu.br
# ==============================================================================

# Redirecionamento automático de HTTP (Porta 80) para HTTPS (Porta 443)
server {
    listen 80;
    listen [::]:80;
    server_name cantina.escola.edu.br;

    # Permitir renovação do Let's Encrypt via ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor Seguro HTTPS (Porta 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cantina.escola.edu.br;

    # Certificados SSL (preenchidos automaticamente pelo Certbot)
    ssl_certificate /etc/letsencrypt/live/cantina.escola.edu.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cantina.escola.edu.br/privkey.pem;

    # Parâmetros de segurança e criptografia moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Cabeçalhos de Proteção e Segurança (HSTS, Anti-Clickjacking, XSS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Limite máximo de envio de arquivos (fotos de cardápio, planilhas SUAP de 500MB)
    client_max_body_size 500M;
    client_body_buffer_size 128k;

    # Timeout para requisições mais demoradas (como importações em massa)
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Entrega direta de arquivos estáticos pelo Nginx (alto desempenho e cache)
    location /static/ {
        alias /var/www/almoco-estudantil/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Proxy Reverso para a aplicação Python (Gunicorn na porta 5000)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Repasse de cabeçalhos de rede originais
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Suporte a WebSockets e Server-Sent Events (caso utilizado)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
