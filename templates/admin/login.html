{% extends "base.html" %}

{% block navbar %}{% endblock %}

{% block content %}
<div class="flex-center fade-in">
    <div class="card" style="width: 100%; max-width: 400px; border-top: 4px solid var(--danger);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <i class="ph ph-shield-check" style="font-size: 3rem; color: var(--danger);"></i>
            <h1 style="margin-top: 0.5rem; font-size: 1.5rem;">Controle de Acesso</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Área Administrativa</p>
        </div>

        <form method="POST" action="{{ url_for('admin_login') }}">
            <div class="form-group">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" name="usuario" required>
            </div>
            
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>
                <small style="color:var(--text-muted); display:block; margin-top:0.25rem; font-size: 0.8rem;">
                    <strong>Dica:</strong> Se for o primeiro deploy, rode `python init_admin.py` no servidor para criar a conta de administrador inicial.
                </small>
            </div>
            
            <div class="form-group" style="display: flex; align-items: center; gap: 8px; margin-top: 1rem; margin-bottom: 1.5rem;">
                <input type="checkbox" id="lembrar_me" name="lembrar_me" style="width: auto; margin: 0;">
                <label for="lembrar_me" style="margin: 0; font-size: 0.9rem; cursor: pointer; user-select: none; color: var(--text-main);">Manter-me conectado por 30 dias</label>
            </div>
            
            <button type="submit" class="btn btn-danger" style="width: 100%;"><i class="ph ph-sign-in" style="margin-right: 8px;"></i> Entrar</button>
        </form>
        
        <div style="text-align: center; margin-top: 2rem;">
            <a href="{{ url_for('login') }}" style="font-size: 0.85rem; color: var(--text-muted);"><i class="ph ph-student"></i> Voltar para Área do Aluno</a>
        </div>
    </div>
</div>
{% endblock %}
